name: pages

# The Frontier as a static site. The toolchain (pixi's wasm environment, ludens_wasm_rt) comes from the pinned engine:
# it is checked out beside this repository and its pixi manifest is used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the page and play it without COOP/COEP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Assets - manifest, licences and credits agree"
        run: python3 scripts/fetch_assets.py --check
      - uses: actions/checkout@v5
        with:
          repository: Hundo1018/ludens-engine
          ref: a509b7f48b4ffb4e3874a54924667ff199f16e35
          path: engine
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: engine/pixi.toml
          cache: true
          environments: wasm
      - name: Build build/page
        run: pixi run --manifest-path engine/pixi.toml -e wasm bash scripts/build_page.sh
      - name: Install Mesa lavapipe (software Vulkan) for the native harness
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - name: "Native wgpu runtime (libwgpu_native, callback bridge) for the native harness"
        run: |
          bash scripts/deps.sh
          pixi run --manifest-path engine/pixi.toml -e wasm bash -c 'CONDA_PREFIX="$CONDA_PREFIX" bash build/deps/wgpu-mojo/scripts/setup-native.sh'
      - name: "Native harness: B1 (CPU) and B3 (GPU against CPU, per vertex) on lavapipe"
        env:
          LVP_DIR: /usr/share/vulkan/icd.d
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan
        run: |
          export VK_ICD_FILENAMES="$(ls $LVP_DIR/lvp_icd*.json | head -1)"
          pixi run --manifest-path engine/pixi.toml -e wasm bash scripts/test_frontier_native.sh --require-gpu
      - name: Play the page in headless Chrome, served without COOP/COEP
        run: |
          mkdir -p build/shots
          python3 -m http.server 8150 --bind 127.0.0.1 --directory build/page >/dev/null 2>&1 &
          sleep 2
          pixi run --manifest-path engine/pixi.toml -e wasm node scripts/host_check.mjs \
            "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen" build/shots/host 150
      - name: "Frontier world: streams, walks, travels to each zone, unloads behind (scripts/frontier_check.mjs)"
        run: |
          pixi run --manifest-path engine/pixi.toml -e wasm node scripts/frontier_check.mjs \
            "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen" build/shots/frontier 240
      - name: "Touch: the engine's virtual pad drives W A S D, Space and R on a phone-sized screen"
        run: |
          pixi run --manifest-path engine/pixi.toml -e wasm node scripts/touch_check.mjs \
            "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen&pad=1" 240
      - name: "Camera look: a left-button drag turns the camera by 300 px x 0.006 rad, a move without a button does not (scripts/look_check.mjs)"
        run: |
          pixi run --manifest-path engine/pixi.toml -e wasm node scripts/look_check.mjs \
            "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen" 240
      - name: "Protagonist: a skinned Fox at the player's feet, facing its velocity (scripts/protagonist_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/protagonist_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" 240 || exit 1
          done
      - name: "Quarry: the wall is released as the player comes near, falls, and breaks (scripts/physics_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/physics_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" 300 || exit 1
          done
      - name: "Crowd in a Worker: the worker's crowd equals the page's, step for step (scripts/crowd_worker_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/crowd_worker_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" 300 || exit 1
          done
      - name: "Guard: a player in the town square is touched once and sent back to the hub (scripts/guard_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/guard_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?at=118,128" 300 || exit 1
          done
      - name: "Ragdoll (B4): the guard's tackle knocks it down; a figure on ball joints falls more than 0.5 m (scripts/ragdoll_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/ragdoll_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen&at=118,128" 300 || exit 1
          done
      - name: "Destruction sync (C): a fractured wall on SnapshotServer, two clients' read-back hashes equal the server's at latency 4 (scripts/fracnet_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/fracnet_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen" 300 || exit 1
          done
      - name: "Motion matching (E1): the guard runs above 5 m/s and walks below 1.5 m/s; residents walk (scripts/town_motion_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/town_motion_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?offscreen&at=112,142" 300 || exit 1
          done
      - name: "Foot IK (E2): on a 20 degree ramp the IK walker's feet stay within 10 mm, the plain one's are off by more than 50 mm (scripts/foot_ik_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/foot_ik_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?notown" 300 || exit 1
          done
      - name: "Visual quality (V): four views, flat-colour share, floating objects, sky gradient, fog, wall variety (scripts/visual_check.py --bounds, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm python3 scripts/visual_check.py \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" build/shots/visual --bounds || exit 1
          done
      - name: "Sound: four CC0 effects load, a goal starts its sound once, the worklet is fed (scripts/audio_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/audio_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" 300 || exit 1
          done
      - name: "Camp: a rope on ball joints keeps its length and swings; a cloth banner moves in the wind (scripts/camp_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/camp_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html?notown" 300 || exit 1
          done
      - name: "Town AI: residents run a behavior tree and watch the player; the guard sees through a cone with line of sight (scripts/town_ai_check.mjs, three runs)"
        run: |
          for i in 1 2 3; do
            pixi run --manifest-path engine/pixi.toml -e wasm node scripts/town_ai_check.mjs \
              "$(which google-chrome || which chromium)" "http://127.0.0.1:8150/index.html" 300 || exit 1
          done
      - name: Native and wasm give the same numbers
        run: |
          HOST="$(pixi run --manifest-path engine/pixi.toml -e wasm python3 -c 'import ludens_wasm_rt; print(ludens_wasm_rt.HOST_MJS)')"
          pixi run --manifest-path engine/pixi.toml -e wasm bash scripts/check_parity.sh "$HOST"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/page

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
